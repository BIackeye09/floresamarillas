<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover -> respeta el "notch" del iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2a1d" />
  <meta name="description" content="Un pequeño jardín que crece para ti." />

  <title>Flores amarillas para ti</title>

  <!-- Tipografías (si no hay internet, se usan las fuentes del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- ===================================================================
       CAPA 1: FONDO (degradados + luces desenfocadas). Solo decorativo.
       =================================================================== -->
  <div class="fondo" aria-hidden="true">
    <span class="luz luz-a"></span>
    <span class="luz luz-b"></span>
    <span class="luz luz-c"></span>
    <span class="niebla"></span>
  </div>

  <!-- CAPA 2: pétalos y partículas ambientales (las llena script.js) -->
  <div class="ambiente" id="ambiente" aria-hidden="true"></div>

  <!-- CAPA 3: el jardín.
       El césped y las flores se generan en script.js.
       Hay dos capas de césped: una detrás de las flores y otra delante,
       para que los tallos se vean realmente plantados en la hierba. -->
  <div class="jardin" id="jardin" aria-hidden="true">
    <div class="suelo"></div>
    <div class="cesped cesped-atras" id="cesped-atras"></div>
    <div class="flores" id="flores"></div>
    <div class="cesped cesped-frente" id="cesped-frente"></div>
  </div>

  <!-- ===================================================================
       CAPA 4: CONTENIDO (foto, mensaje, botón)
       Aparece progresivamente cuando el jardín ya creció.
       =================================================================== -->
  <main class="contenido">

    <!-- ---------- Fotografía ----------
         Para cambiarla: reemplaza el archivo foto.jpg en la raíz del proyecto
         (no hace falta tocar el JavaScript ni esta línea). -->
    <figure class="tarjeta revelable" style="--d: 8.8s">
      <div class="marco">
        <img
          id="foto"
          src="foto.jpg"
          alt="Fotografía de ella"
          width="1200" height="1600"
          decoding="async" />
      </div>
      <figcaption class="pie" id="pie-foto"></figcaption>
    </figure>

    <!-- ---------- Mensaje ----------
         El texto se escribe desde la sección CONFIGURACIÓN PERSONAL de script.js -->
    <section class="mensaje revelable" style="--d: 10.2s">
      <p class="saludo" id="saludo"></p>
      <p class="texto" id="texto"></p>
    </section>

    <p class="frase revelable" id="frase" style="--d: 11.6s"></p>

    <!-- ---------- Interacción ---------- -->
    <div class="acciones revelable" style="--d: 12.7s">
      <button type="button" class="boton" id="btn-flor">
        <span class="boton-texto" id="btn-flor-texto">Haz crecer una flor</span>
      </button>
      <p class="contador" id="contador" aria-live="polite"></p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
